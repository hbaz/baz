# AAMVA pack - impact levels.
# Data, not code. Drawn from v3's intent only (its text is not copied).
# The closed vocabulary for the `impact` field of every classified record.
# Order 1 is the highest. Government Affairs owns the definitions.
#
# requires_assessment: the record must carry a short assessment (with citations).
# include_in_digest:   false keeps the item in the store but out of the digest.

levels:
  - id: direct
    label: "Direct"
    order: 1
    color: "#b42318"
    requires_assessment: true
    include_in_digest: true
    definition: "The action changes what motor vehicle or driver licensing agencies must do, or what they may do: a new or changed requirement, deadline, standard, funding condition or data-exchange obligation that applies to them."
    what_direct_means_here: "A jurisdiction would have to change a process, a system, a form or a budget line to comply."
  - id: adjacent
    label: "Adjacent"
    order: 2
    color: "#dc6803"
    requires_assessment: false
    include_in_digest: true
    definition: "The action applies to people or businesses the agencies serve or regulate (drivers, CDL holders, motor carriers, dealers, manufacturers, law enforcement), and is likely to reach the agencies' work indirectly."
  - id: contextual
    label: "Contextual"
    order: 3
    color: "#1570ef"
    requires_assessment: false
    include_in_digest: true
    definition: "Background that helps track the policy landscape in a watched area (research, data releases, early-stage requests for information, announcements) with no near-term obligation."
  - id: peripheral
    label: "Peripheral"
    order: 4
    color: "#667085"
    requires_assessment: false
    include_in_digest: false
    definition: "From a watched agency but outside every policy area, or only a passing mention. Kept for the record and the monthly sample audit, left out of the digest."

# Escalation signals: a record showing one of these is raised by at least one
# level (never above direct), and the signal id is added to its `signals` list
# with a cited passage. The classifier names the signal; code checks the id.
escalation_signals:
  - id: state_agency_named
    description: "The text names state motor vehicle or driver licensing agencies, or state licensing or titling functions, as subject to the action."
  - id: compliance_deadline
    description: "The text sets a compliance date, effective date or implementation deadline for states."
  - id: comment_period_open
    description: "A comment period is open and closes within 45 days of the run date."
  - id: funding_condition
    description: "Federal grant or funding eligibility depends on a state action (for example a sanction or withholding)."
  - id: system_or_data_exchange
    description: "The action changes a records system, data exchange or reporting duty that jurisdictions take part in."
  - id: watched_committee_priority
    description: "The subject matches a current priority of a watched committee (see watchlist.yaml); this is the committee-interest boost."
  - id: emergency_or_interim
    description: "An interim final rule, emergency action, waiver or exemption that takes effect without the usual notice period."

# Handling rules applied before escalation.
rules:
  - id: information_collection
    description: "A routine information collection (Paperwork Reduction Act) notice is contextual unless it changes what states must report, in which case it is direct."
  - id: enforcement_action
    description: "An enforcement action against one named carrier or company is peripheral unless it sets a policy or precedent for a watched area."
