# Source: U.S. Department of Transportation newsroom (press releases).
# Kind html_list: a list page plus an article page, read with the extraction
# rules below. Zero matches or malformed output is a recorded source failure,
# never a silent skip. VERIFY before the first live run: whether the site
# offers an RSS feed (prefer kind rss if so), the list URL, the selectors and
# robots.txt; record the result and its date in the source verify notes.
id: usdot_news
enabled: false
status: blocked_by_site
note: "Spike S2 (2026-10-13): the site refuses every non-browser client, robots.txt included, from the routine and from a residential address; shipped disabled, no bot-check workaround (owner decision)."
kind: html_list
class: website
label: "U.S. Department of Transportation press releases"
url: "https://www.transportation.gov/newsroom/press-releases"
hosts: ["www.transportation.gov"]
data_class: public
# Press releases name officials and other people.
names_people: true
agencies: [usdot]
extract:
  list:
    # Each entry on the list page that links to one release.
    item_selector: ".view-content .views-row"
    link_selector: "a"
    link_attr: "href"
    title_selector: "a"
    date_selector: "time, .date"
    date_formats: ["%B %d, %Y", "%Y-%m-%d", "%m/%d/%Y"]
    # Only follow links on the declared hosts.
    same_host_only: true
  article:
    title_selector: "h1"
    date_selector: "time, .date"
    body_selector: "article .field--name-body, main article"
    date_formats: ["%B %d, %Y", "%Y-%m-%d", "%m/%d/%Y"]
  required_fields: [title, url, published_on, body]
config:
  canonical_key: "{url}"
  item_id: "usdot_news-{url_hash}"
  stage: announcement
  text_fields: [title, body]
limits:
  polling: "once per run"
  page_cap: 2
  max_items: 25
  host_delay_ms: 2000
  timeout_s: 30
  honor_robots_txt: true
