# Source: Federal Register documents (published).
# Schema shared with packs/<id>/sources/*.yaml (architecture section 7.1).
# API facts marked VERIFY are unconfirmed; check them against
# https://www.federalregister.gov/developers/documentation/api/v1 before the first live run.
id: fedreg
kind: fedreg
class: api
label: "Federal Register documents"
url: "https://www.federalregister.gov/api/v1/documents.json"
hosts: ["www.federalregister.gov"]
data_class: public
# Notices can name individuals (petitioners, exemption applicants, officials).
names_people: true
agencies: [usdot, nhtsa, fmcsa, fhwa, dhs, tsa]
config:
  # Query: one request per agency slug (from watchlist.yaml) per window.
  # conditions[agencies][] takes one slug per repeated parameter.
  agency_param: "conditions[agencies][]"
  date_from_param: "conditions[publication_date][gte]"
  date_to_param: "conditions[publication_date][lte]"
  document_types: [RULE, PRORULE, NOTICE, PRESDOCU]
  type_param: "conditions[type][]"
  order: newest
  per_page: 100
  # Paging: follow next_page_url until absent or the page cap (VERIFY field name).
  next_page_field: "next_page_url"
  results_field: "results"
  fields: [document_number, title, type, abstract, action, agencies, publication_date, effective_on, comments_close_on, docket_ids, regulation_id_numbers, html_url, body_html_url]
  # Shared with fedreg_pi so a Public Inspection item becomes this record.
  canonical_key: "{document_number}"
  item_id: "fedreg-{document_number}"
  date_fields:
    published: publication_date
    effective: effective_on
    comments_close: comments_close_on
  text_fields: [title, abstract, action, body]
  # Full text for verbatim citation checks, fetched from body_html_url.
  fetch_body: true
limits:
  polling: "once per run"
  page_cap: 10
  max_items: 200
  host_delay_ms: 1000
  timeout_s: 30
