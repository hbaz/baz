# Source: Federal Register Public Inspection (documents filed, not yet published).
# A PI item shares its canonical key with the later fedreg record, which
# replaces its stage when it publishes.
# VERIFY: the endpoint, its date condition and its paging have not been
# checked against https://www.federalregister.gov/developers/documentation/api/v1
# (v3 never checked them either). Record the result before the first live run.
id: fedreg_pi
kind: fedreg_pi
class: api
label: "Federal Register Public Inspection"
url: "https://www.federalregister.gov/api/v1/public-inspection-documents.json"
hosts: ["www.federalregister.gov"]
data_class: public
names_people: true
agencies: [usdot, nhtsa, fmcsa, fhwa, dhs, tsa]
config:
  agency_param: "conditions[agencies][]"
  # VERIFY: the PI date condition name.
  date_param: "conditions[available_on]"
  per_page: 100
  next_page_field: "next_page_url"
  results_field: "results"
  fields: [document_number, title, type, agencies, filed_at, publication_date, docket_numbers, html_url, pdf_url]
  canonical_key: "{document_number}"
  item_id: "fedreg-{document_number}"
  stage: pre_publication
  date_fields:
    filed: filed_at
    scheduled_publication: publication_date
  text_fields: [title]
  fetch_body: false
limits:
  polling: "once per run"
  page_cap: 5
  max_items: 100
  host_delay_ms: 1000
  timeout_s: 30
