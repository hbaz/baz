# Source: Federal Register documents (published) from one agency: Federal Motor Carrier Safety Administration.
# Spike S2 (2026-10-13, owner decision): the DOT newsroom sites refuse
# non-browser clients, so this agency's rules, proposed rules and notices
# are read from the Federal Register API instead, filtered to one agency.
# Same endpoint, paging and record shape as fedreg.yaml; a document also
# found by fedreg shares its canonical key and item id with it.
# The slug comes from watchlist.yaml (agency id below) and is repeated in
# agency_slug so the filter is visible here; the two must agree
# (zero/tests/test_sources_api.py, test_fedreg_agency_filter).
# VERIFY: slug not yet confirmed; slug_verified stays false until the owner records it in the S2 evidence (T204).
id: fedreg_fmcsa
kind: fedreg
class: api
label: "Federal Register documents: Federal Motor Carrier Safety Administration"
url: "https://www.federalregister.gov/api/v1/documents.json"
hosts: ["www.federalregister.gov"]
data_class: public
# Notices can name individuals (petitioners, exemption applicants, officials).
names_people: true
# Exactly one agency: one conditions[agencies][] filter per request.
agencies: [fmcsa]
agency_slug: "federal-motor-carrier-safety-administration"
slug_verified: false
config:
  agency_param: "conditions[agencies][]"
  date_from_param: "conditions[publication_date][gte]"
  date_to_param: "conditions[publication_date][lte]"
  # Rules, proposed rules and notices.
  document_types: [RULE, PRORULE, NOTICE]
  type_param: "conditions[type][]"
  order: newest
  per_page: 100
  next_page_field: "next_page_url"
  results_field: "results"
  fields: [document_number, title, type, abstract, action, agencies, publication_date, effective_on, comments_close_on, docket_ids, regulation_id_numbers, html_url, body_html_url]
  canonical_key: "{document_number}"
  item_id: "fedreg-{document_number}"
  date_fields:
    published: publication_date
    effective: effective_on
    comments_close: comments_close_on
  text_fields: [title, abstract, action, body]
  fetch_body: true
limits:
  polling: "once per run"
  page_cap: 10
  max_items: 200
  host_delay_ms: 1000
  timeout_s: 30
